plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
}

dependencies {

    implementation project(':')  // Root project
    compileOnly "io.papermc.paper:paper-api:26.2.build.+"
    testImplementation "io.papermc.paper:paper-api:26.2.build.+"

}

shadowJar {
    relocate 'io.netty', 'net.buildtheearth.terraminusminus.shaded.io.netty'

    dependencies {
        include(dependency('io.netty:.*'))
        include(project(':'))
    }

    archiveFileName = 'terraminusminus.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
    enabled = false
}

processResources {
    inputs.property "version", project.version
    filesMatching("paper-plugin.yml") {
        expand 'version': project.version
    }
}

tasks.assemble.dependsOn shadowJar

publishing {
    publications {
        terraminusminusBukkit(MavenPublication) {
            groupId = project.group
            artifactId = "terraminusminus-bukkit"
            version = project.version
            from components.shadow
        }
    }
}